server {
    listen 80;
    server_name localhost;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to backend
    location /serverRequest {
        proxy_pass http://backend:3000/serverRequest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resolveVanityURL {
        proxy_pass http://backend:3000/resolveVanityURL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /getSteamLibrary {
        proxy_pass http://backend:3000/getSteamLibrary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /getRecommendations {
        proxy_pass http://backend:3000/getRecommendations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
} 